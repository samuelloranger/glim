name: Publish docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "install.sh"
      - ".github/workflows/docs-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Build docs
        env:
          DOCS_BASE: ${{ secrets.DOCS_BASE }}
          DOCS_HOSTNAME: ${{ secrets.DOCS_HOSTNAME }}
        run: bun run docs:build
      - name: Push built docs
        env:
          TOKEN: ${{ secrets.DOCS_TOKEN }}
          REPO: ${{ secrets.DOCS_REPO }}
          DEST: ${{ secrets.DOCS_DEST }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$REPO" ] || [ -z "$DEST" ]; then
            echo "docs publish not configured; skipping"
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${REPO}.git" out
          rm -rf "out/${DEST}"
          mkdir -p "out/${DEST}"
          cp -r docs/.vitepress/dist/. "out/${DEST}/"
          cd out
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${DEST}"
          git diff --cached --quiet || git commit -m "docs(glim): sync ${GITHUB_SHA::7}"
          git push
